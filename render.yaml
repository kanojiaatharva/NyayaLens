services:
  # Unified Web Service (Spring Boot 3.4 serving API + Vite SPA static assets)
  - type: web
    name: nyayalens-service
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: default
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_FLASH_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_PRO_MODEL
        value: gemini-3.1-pro-preview
      - key: GEMINI_MODEL_FAST
        value: gemini-3.8-flash
      - key: GEMINI_MODEL_REASONING
        value: gemini-3.1-pro-preview
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://nyayalens-service.onrender.com,http://localhost:5173,http://localhost:8080"
