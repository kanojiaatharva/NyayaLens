server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: nyayalens-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE_MB:15}MB
      max-request-size: ${MAX_UPLOAD_SIZE_MB:15}MB
      file-size-threshold: 2MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.nayalens: INFO
    org.springframework.security: WARN
    org.springframework.web: INFO

nyayalens:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    flash-model: ${GEMINI_FLASH_MODEL:gemini-3.8-flash}
    pro-model: ${GEMINI_PRO_MODEL:gemini-3.1-pro-preview}
    timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:30}
    max-retries: ${GEMINI_MAX_RETRIES:2}
  rate-limits:
    analyze-rpm: ${RATE_LIMIT_ANALYZE_RPM:10}
    compare-rpm: ${RATE_LIMIT_COMPARE_RPM:10}
    question-rpm: ${RATE_LIMIT_QUESTION_RPM:30}
    general-rpm: ${RATE_LIMIT_GENERAL_RPM:60}
  document:
    max-pages: ${MAX_DOCUMENT_PAGES:50}
    session-ttl-minutes: ${DOCUMENT_SESSION_TTL_MINUTES:60}
